# .github/workflows/collect.yml
name: collect
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - run: python -m app.main collect --trigger ${{ github.event_name }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        working-directory: worker       
        env:
          ENV: prod
          LLM_JSON_MODE: "1"
          LLM_MIN_INTERVAL_SECONDS: "20"
          MAX_ARTICLES_PER_RUN: "6"
          LLM_REASONING_EFFORT: "low"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
